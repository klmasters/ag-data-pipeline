name: MMN 2885 Kansas Hay Weekly Sync

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 14:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests psycopg2-binary

      - name: Run MMN 2885 sync
        env:
          MMN_API_KEY: ${{ secrets.MMN_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python fetch_mmn_2885.py
